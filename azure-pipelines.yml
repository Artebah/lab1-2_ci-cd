trigger:
  branches:
    include:
      - main

pool:
  name: "MyAgentPool"

variables:
  dockerRegistryServiceConnection: "dockerhub-connection" # Назва твого Service Connection
  imageRepository: "artebah/lab1-cicd" # Назва твого репозиторію в Docker Hub
  containerRegistry: "docker.io"
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  tag: "latest"

stages:
  - stage: BuildAndTest
    displayName: "Build and Test Stage"
    jobs:
      - job: Build
        displayName: "Run tests and build"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "18.x"
            displayName: "Install Node.js"

          - script: |
              npm install
              npm test
            displayName: "Install dependencies and run unit tests"

  - stage: PushToDockerHub
    displayName: "Docker Build and Push Stage"
    dependsOn: BuildAndTest
    jobs:
      - job: Push
        displayName: "Build and push Docker image"
        steps:
          # 1. Авторизуемся в Docker Hub через Service Connection
          - task: Docker@2
            displayName: "Login to Docker Hub"
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              command: "login"

          # 2. Собираем образ локально (без попытки пушить автоматически)
          - task: Docker@2
            displayName: "Build Docker image"
            inputs:
              command: "build"
              repository: "$(imageRepository)"
              dockerfile: "$(dockerfilePath)"
              tags: |
                $(tag)

          # 3. Отправляем собранный образ в Docker Hub явной командой push
          - task: Docker@2
            displayName: "Push Docker image"
            inputs:
              command: "push"
              repository: "$(imageRepository)"
              tags: |
                $(tag)
