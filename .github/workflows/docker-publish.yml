name: Reusable Docker Publish

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
        default: "latest"
      push-to-hub:
        required: true
        type: boolean
        default: false
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker-pack-n-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.push-to-hub }}
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          outputs: ${{ inputs.push-to-hub == true && 'type=image,push=true' || 'type=docker,dest=/tmp/image.tar' }}

      - name: Upload artifact if not pushing
        if: ${{ !inputs.push-to-hub }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
