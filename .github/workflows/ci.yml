name: CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "bugfix/*"
    paths-ignore:
      - "docs/**"
      - "README.md"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies and run tests
        run: |
          npm install
          npm test

  call-docker-publish:
    needs: build-and-test
    uses: ./.github/workflows/docker-publish.yml
    with:
      image-name: "lab1-cicd"
      image-tag: "latest"
      push-to-hub: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
