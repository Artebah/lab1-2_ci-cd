openapi: 3.0.0
info:
  title: Lab 1 REST API
  version: 1.0.0
  description: Simple CRUD API for CI/CD Lab
paths:
  /api/items:
    get:
      summary: Get all items
      responses:
        "200":
          description: Successful operation
    post:
      summary: Create a new item
      responses:
        "201":
          description: Created
  /api/items/{id}:
    get:
      summary: Get item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
        "404":
          description: Not found
